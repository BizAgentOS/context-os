                  class="icon-button"
                  id="upload-button"
                  type="button"
                  aria-label="上传企业资料"
                  title="上传 CSV、Markdown 或 TXT"
                >
                  <svg class="icon" aria-hidden="true">
                    <use href="#i-plus" />
                  </svg>
                </button>
                <span class="composer-note" id="composer-note"></span>
                <button
                  class="demo-question"
                  id="demo-question"
                  type="button"
                  hidden
                ></button>
              </div>
              <button
                class="send-button"
                id="send-button"
                type="submit"
                aria-label="发送"
                disabled
              >
                <svg class="icon" aria-hidden="true">
                  <use href="#i-arrow" />
                </svg>
              </button>
              <button
                class="send-button stop-button"
                id="stop-button"
                type="button"
                aria-label="停止生成"
                title="停止生成"
                hidden
              >
                <svg class="icon" aria-hidden="true">
                  <use href="#i-stop" />
                </svg>
              </button>
            </div>
          </form>
        </div>
        <button id="collapse-composer" class="chat-collapse" type="button" aria-label="收起企业助手" aria-controls="chat-surface"><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></button>
        </div>
      </section>
    </div>

    <input type="file" id="file-input" accept=".csv,.md,.txt" hidden />
    <div class="drop-overlay" id="drop-overlay" hidden>
      <span>松开，接入这份资料</span>
    </div>

    <dialog
      id="settings-dialog"
      class="settings-dialog"
      aria-labelledby="settings-title"
    >
      <form id="settings-form">
        <div class="dialog-heading">
          <h2 id="settings-title">连接模型</h2>
          <button
            class="icon-button"
            id="close-settings"
            type="button"
            aria-label="关闭模型设置"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </div>
        <label for="provider-input">服务商</label>
        <select id="provider-input">
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="zhipu">智谱 GLM · 普通 API</option>
          <option value="zhipu-coding">智谱 GLM · Coding Plan</option>
          <option value="zai-coding">Z.ai GLM · Coding Plan</option>
          <option value="custom">自定义 API</option>
        </select>
        <div id="custom-api-fields" hidden>
          <label for="protocol-input">接口协议</label>
          <select id="protocol-input"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic 兼容</option></select>
          <label for="base-url-input">API Base URL</label>
          <input id="base-url-input" type="url" autocomplete="off" placeholder="https://example.com/v1" />
          <p class="field-note">OpenAI 通常填 https://example.com/v1；Anthropic 通常填 https://example.com（自动追加 /v1/messages）。不要填完整生成路径。更换地址或协议需使用该接口的密钥。</p>
        </div>
        <label for="model-input">模型</label>
        <input id="model-input" type="text" autocomplete="off" placeholder="填写账户可用的模型 ID" required />
        <p class="field-note" id="glm-key-note">GLM 请按密钥所属平台及套餐选择；普通 API 与 Coding Plan 使用不同入口。模型名称以你的账户可用模型为准。</p>
        <label for="api-key-input">API Key</label>
        <input
          id="api-key-input"
          type="password"
          autocomplete="off"
          placeholder="填写密钥"
        />
        <p class="field-note" id="key-note">密钥仅用于当前服务进程。</p>
        <p
          class="settings-status"
          id="settings-status"
          role="status"
          hidden
        ></p>
        <div class="dialog-actions">
          <button class="quiet-button" id="test-connection" type="button">
            测试连接</button
          ><button class="primary-button" id="save-settings" type="submit">
            保存
          </button>
        </div>
      </form>
    </dialog>

    <dialog
      id="credential-dialog"
      class="settings-dialog credential-dialog"
      aria-labelledby="credential-title"
    >
      <div class="dialog-heading">
        <h2 id="credential-title">访问已启用</h2>
        <button
          class="icon-button"
          id="close-credential"
          type="button"
          aria-label="关闭凭据交付"
        >
          <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <p class="credential-intro" id="credential-consumer"></p>
      <label for="consumer-api-key">调用方 API Key</label>
      <input
        id="consumer-api-key"
        type="text"
        readonly
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <p class="field-note">
        只在这里显示一次。请保存到调用应用的凭据配置中，关闭后无法再次查看。
      </p>
      <p
        class="settings-status"
        id="credential-status"
        role="status"
        hidden
      ></p>
      <div class="dialog-actions">
        <button class="quiet-button" id="copy-credential" type="button">
          复制密钥
        </button>
        <button class="primary-button" id="finish-credential" type="button">
          已保存
        </button>
      </div>
    </dialog>
  </body>
</html>
