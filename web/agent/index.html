<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>DataEngine · 企业记忆</title>
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./memory-graph.css" />
    <script src="./app.js" type="module"></script>
  </head>
  <body>
    <svg
      class="icon-definitions"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24">
          <path d="M12 19V5m-6 6 6-6 6 6" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M19 12H5m6-6-6 6 6 6" />
        </symbol>
        <symbol id="i-right" viewBox="0 0 24 24">
          <path d="M5 12h14m-6-6 6 6-6 6" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M18 6 6 18" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path d="M4 7h16M4 17h16" />
          <circle cx="8" cy="7" r="3" />
          <circle cx="16" cy="17" r="3" />
        </symbol>
        <symbol id="i-source" viewBox="0 0 24 24">
          <path d="M6 3h8l4 4v14H6ZM14 3v5h4M9 12h6M9 16h6" />
        </symbol>
        <symbol id="i-stop" viewBox="0 0 24 24">
          <rect x="7" y="7" width="10" height="10" rx="1" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
      </defs>
    </svg>

    <div class="canvas-app">
      <header class="topbar">
        <span class="wordmark"
          >DataEngine<span class="wordmark-dot">.</span></span
        >
        <nav class="page-nav" aria-label="企业记忆">
          <button type="button" data-page="setup" aria-current="page">
            企业与数据
          </button>
          <button type="button" data-page="ontology" disabled>
            本体工作区
          </button>
          <button type="button" data-page="consumption" disabled>
            消费与治理
          </button>
        </nav>
        <span class="demo-badge" id="demo-badge" hidden>演示数据</span>
        <button
          class="icon-button settings-button"
          id="open-settings"
          type="button"
          aria-label="模型设置"
          title="模型设置"
        >
          <svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg>
        </button>
      </header>

      <main id="canvas" class="canvas" tabindex="-1" aria-label="企业内容">
        <section class="empty-canvas"><h1>你的企业叫什么？</h1></section>
      </main>

      <section class="interaction" data-mode="compact" aria-label="创建企业记忆">
        <button id="open-composer" class="chat-launcher" type="button" aria-label="展开企业助手" aria-expanded="true" aria-controls="chat-surface" hidden>DataEngine<span id="chat-activity" hidden> · 正在处理</span></button>
        <div id="chat-surface" class="chat-surface" tabindex="-1">
        <section class="history-panel" aria-label="当前页面对话">
          <button id="toggle-history" class="history-toggle" type="button" aria-expanded="false" aria-controls="dialogue">
            <span id="history-label">最近一条</span>
            <svg class="icon" aria-hidden="true"><use href="#i-right" /></svg>
          </button>
        <div
          class="dialogue"
          id="dialogue"
          role="log"
          tabindex="0"
          aria-label="当前页面对话历史"
          aria-live="polite"
          aria-relevant="additions text"
          hidden
        ></div>
        </section>
        <div class="composer-wrap">
          <p class="request-error" id="request-error" role="alert" hidden></p>
          <div class="focus-context" id="focus-context" hidden>
            <span id="focus-label"></span>
            <button class="quiet-button" id="inspect-focus" type="button">
              查看引用
            </button>
            <button
              class="icon-button"
              id="clear-focus"
              type="button"
              aria-label="取消当前内容引用"
            >
              <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
            </button>
          </div>
          <form class="composer" id="composer">
            <textarea
              id="message-input"
              rows="1"
              maxlength="6000"
              placeholder="从你的企业开始…"
              aria-label="与企业记忆助手对话"
            ></textarea>
            <div class="composer-actions">
              <div class="composer-left">
                <button
                  class="icon-button"
                  id="upload-button"
                  type="button"
                  aria-label="上传企业资料"
                  title="上传 CSV、Markdown 或 TXT"
                >
                  <svg class="icon" aria-hidden="true">
                    <use href="#i-plus" />
                  </svg>
                </button>
                <span class="composer-note" id="composer-note"></span>
                <button
                  class="demo-question"
                  id="demo-question"
                  type="button"
                  hidden
                ></button>
              </div>
              <button
                class="send-button"
                id="send-button"
                type="submit"
                aria-label="发送"
                disabled
              >
                <svg class="icon" aria-hidden="true">
                  <use href="#i-arrow" />
                </svg>
              </button>
              <button
                class="send-button stop-button"
                id="stop-button"
                type="button"
                aria-label="停止生成"
                title="停止生成"
                hidden
              >
                <svg class="icon" aria-hidden="true">
                  <use href="#i-stop" />
                </svg>
              </button>
            </div>
          </form>
        </div>
        <button id="collapse-composer" class="chat-collapse" type="button" aria-label="收起企业助手" aria-controls="chat-surface"><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></button>
        </div>
      </section>
    </div>

    <input type="file" id="file-input" accept=".csv,.md,.txt" hidden />
    <div class="drop-overlay" id="drop-overlay" hidden>
      <span>松开，接入这份资料</span>
    </div>

    <dialog
      id="settings-dialog"
      class="settings-dialog"
      aria-labelledby="settings-title"
    >
      <form id="settings-form">
        <div class="dialog-heading">
          <h2 id="settings-title">连接模型</h2>
          <button
            class="icon-button"
            id="close-settings"
            type="button"
            aria-label="关闭模型设置"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </div>
        <label for="provider-input">服务商</label>
        <select id="provider-input">
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="zhipu">智谱 GLM · 普通 API</option>
          <option value="zhipu-coding">智谱 GLM · Coding Plan</option>
          <option value="zai-coding">Z.ai GLM · Coding Plan</option>
          <option value="custom">自定义 API</option>
        </select>
        <div id="custom-api-fields" hidden>
          <label for="protocol-input">接口协议</label>
          <select id="protocol-input"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic 兼容</option></select>
          <label for="base-url-input">API Base URL</label>
          <input id="base-url-input" type="url" autocomplete="off" placeholder="https://example.com/v1" />
          <p class="field-note">OpenAI 通常填 https://example.com/v1；Anthropic 通常填 https://example.com（自动追加 /v1/messages）。不要填完整生成路径。更换地址或协议需使用该接口的密钥。</p>
        </div>
        <label for="model-input">模型</label>
        <input id="model-input" type="text" autocomplete="off" placeholder="填写账户可用的模型 ID" required />
        <p class="field-note" id="glm-key-note">GLM 请按密钥所属平台及套餐选择；普通 API 与 Coding Plan 使用不同入口。模型名称以你的账户可用模型为准。</p>
        <label for="api-key-input">API Key</label>
        <input
          id="api-key-input"
          type="password"
          autocomplete="off"
          placeholder="填写密钥"
        />
        <p class="field-note" id="key-note">密钥仅用于当前服务进程。</p>
        <p
          class="settings-status"
          id="settings-status"
          role="status"
          hidden
        ></p>
        <div class="dialog-actions">
          <button class="quiet-button" id="test-connection" type="button">
            测试连接</button
          ><button class="primary-button" id="save-settings" type="submit">
            保存
          </button>
        </div>
      </form>
    </dialog>

    <dialog
      id="credential-dialog"
      class="settings-dialog credential-dialog"
      aria-labelledby="credential-title"
    >
      <div class="dialog-heading">
        <h2 id="credential-title">访问已启用</h2>
        <button
          class="icon-button"
          id="close-credential"
          type="button"
          aria-label="关闭凭据交付"
        >
          <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <p class="credential-intro" id="credential-consumer"></p>
      <label for="consumer-api-key">调用方 API Key</label>
      <input
        id="consumer-api-key"
        type="text"
        readonly
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <p class="field-note">
        只在这里显示一次。请保存到调用应用的凭据配置中，关闭后无法再次查看。
      </p>
      <p
        class="settings-status"
        id="credential-status"
        role="status"
        hidden
      ></p>
      <div class="dialog-actions">
        <button class="quiet-button" id="copy-credential" type="button">
          复制密钥
        </button>
        <button class="primary-button" id="finish-credential" type="button">
          已保存
        </button>
      </div>
    </dialog>
  </body>
</html>
